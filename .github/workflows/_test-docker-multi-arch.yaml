name: Test Docker Multi-Arch and Push to ECR
run-name: Test Docker Multi-Arch and Push to ECR
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/_test-docker-multi-arch.yaml"
      - ".github/workflows/docker-buildx-push-ecr.yaml"
      - "tests/docker-multi-arch/**"
      - "tests/terraform/docker-buildx-ecr/**"
  workflow_dispatch:
jobs:
  ## Setups
  setup_docker_ecr:
    uses: ./.github/workflows/tf-apply.yaml
    with:
      environment: sandbox
      tf_dir: tests/terraform/docker-buildx-ecr
      tf_backend_configs: |
        bucket=tf-state-911453050078
        key=github-workflow-tests-docker-ecr.tfstate
      tf_var_files: tests/terraform/docker-buildx-ecr/environments/sandbox.tfvars

  ## Tests
  test_docker_buildx_push_ecr:
    name: ${{ matrix.name }}
    needs: setup_docker_ecr
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            image_tag: build_amd
            image_push_sha_tag: false  # prevents conflict on the both job
            docker_platforms: "linux/amd64"
          - name: arm64
            image_tag: build_arm
            image_push_sha_tag: false  # prevents conflict on the both job
            docker_platforms: "linux/arm64"
          - name: both
            image_tag: build_both
            image_push_sha_tag: true
            docker_platforms: "linux/amd64,linux/arm64"
    uses: ./.github/workflows/docker-buildx-push-ecr.yaml
    with:
      aws_account_id: ${{ vars.aws_account_id }}
      aws_region: ${{ vars.aws_region }}
      aws_role_name: ${{ vars.aws_role_name }}
      image_name: test-docker-buildx-push
      image_tag: ${{ matrix.image_tag }}
      image_push_sha_tag: ${{ matrix.image_push_sha_tag }}
      docker_context: tests/docker-multi-arch
      docker_push: true # required to validate the ECR manifest
      docker_platforms: ${{ matrix.docker_platforms }}

  test_docker_buildx_build_args:
    name: args
    uses: ./.github/workflows/docker-buildx-push-ecr.yaml
    with:
      aws_account_id: ${{ vars.aws_account_id }}
      aws_region: ${{ vars.aws_region }}
      aws_role_name: ${{ vars.aws_role_name }}
      image_name: test-docker-buildx-push
      docker_context: tests/docker
      dockerfile_path: tests/docker/build-args.Dockerfile
      docker_push: false
      docker_platforms: "linux/arm64"
      docker_build_args: |
        TEST_BUILD_ARG=expected-value

  ## Cleanups
  # TODO: enable after tests finished
  # cleanup_docker_ecr:
  #   needs:
  #     - setup_docker_ecr
  #     - test_docker_buildx_push_ecr
  #   uses: ./.github/workflows/tf-cleanup.yaml
  #   with:
  #     environment: sandbox
  #     tf_dir: tests/terraform/docker-buildx-ecr
  #     tf_backend_configs: ""
  #     tf_backend_config_files: tests/terraform/docker-buildx-ecr/environments/sandbox.s3.tfbackend
  #     tf_var_files: tests/terraform/docker-buildx-ecr/environments/sandbox.tfvars
