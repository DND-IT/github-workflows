name: Helm Diff Preview

on:
  workflow_call:
    inputs:
      helm_chart_path:
        description: 'Path to the Helm chart directory'
        type: string
        default: 'deploy/app'
      environments_path:
        description: 'Path to the directory containing environment-specific values'
        type: string
        default: 'deploy/app/envs'
      output_path:
        description: 'Path to the output directory for diffs'
        type: string
        default: 'output'
      base_branch:
        description: 'Base branch for comparison'
        type: string
        default: ${{ github.event.pull_request.base.ref }}
      helm_release_name:
        description: 'Name to use for the Helm release when templating'
        type: string
        default: 'app'
      helm_repo_url:
        description: 'URL of the Helm repository to add'
        type: string
        default: 'https://dnd-it.github.io/helm-charts'
      helm_repo_name:
        description: 'Name to give to the Helm repository'
        type: string
        default: 'dnd-it'
      comment_header:
        description: 'Identity for this chart''s section within the single aggregated PR comment. Multiple invocations (e.g. one per chart in a matrix) merge into one comment, each owning a section keyed by this value. Defaults to helm_chart_path.'
        type: string
        default: ''
      debug:
        description: 'Enable debug output'
        type: string
        default: 'false'

env:
  HELM_CHART_PATH: ${{ inputs.helm_chart_path }}
  ENVIRONMENTS_PATH: ${{ inputs.environments_path }}
  OUTPUT_PATH: ${{ inputs.output_path }}
  HELM_RELEASE_NAME: ${{ inputs.helm_release_name }}
  COMMENT_HEADER: ${{ inputs.comment_header || inputs.helm_chart_path }}

jobs:
  diff:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      chart_changed: ${{ steps.changed-files.outputs.chart_values_any_changed }}
      env_values_changed: ${{ steps.changed-files.outputs.env_values_any_changed }}
      env_values_files: ${{ steps.filter-envs.outputs.env_values_files }}
      env_list: ${{ steps.filter-envs.outputs.env_list }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            chart_values:
              - ${{ env.HELM_CHART_PATH }}/values.yaml
              - ${{ env.HELM_CHART_PATH }}/Chart.yaml
            env_values:
              - ${{ env.ENVIRONMENTS_PATH }}/**/*.yaml

      - name: Filter changed environments
        id: filter-envs
        env:
          ENV_VALUES_FILES: ${{ steps.changed-files.outputs.env_values_all_changed_files }}
        run: |
          # Get list of all changed env value files
          echo "env_values_files=$ENV_VALUES_FILES" >> $GITHUB_OUTPUT

          # Extract environment names from paths
          ENV_LIST=""
          if [ -n "$ENV_VALUES_FILES" ]; then
            ENV_LIST=$(echo "$ENV_VALUES_FILES" | xargs -n1 dirname | xargs -n1 basename | sort -u | tr '\n' ' ')
          fi

          # If chart values changed, we need to check all environments
          if [ "${{ steps.changed-files.outputs.chart_values_any_changed }}" == "true" ]; then
            # Get all environments by listing directories
            ALL_ENVS=$(find ${{ env.ENVIRONMENTS_PATH }} -maxdepth 1 -type d | xargs -n1 basename | grep -v "^${ENVIRONMENTS_PATH##*/}$" | tr '\n' ' ')
            if [ -n "$ALL_ENVS" ]; then
              ENV_LIST="$ALL_ENVS"
            fi
          fi

          echo "env_list=$ENV_LIST" >> $GITHUB_OUTPUT
          echo "Environments to diff: $ENV_LIST"

      - name: Show debug info
        if: inputs.debug == 'true'
        run: |
          echo "Chart values changed: ${{ steps.changed-files.outputs.chart_values_any_changed }}"
          echo "Environment values changed: ${{ steps.changed-files.outputs.env_values_any_changed }}"
          echo "Changed environment files: ${{ steps.changed-files.outputs.env_values_all_changed_files }}"
          echo "Environments to check: ${{ steps.filter-envs.outputs.env_list }}"

      - name: Checkout target branch
        uses: actions/checkout@v6
        if: steps.changed-files.outputs.chart_values_any_changed == 'true' || steps.changed-files.outputs.env_values_any_changed == 'true'
        with:
          ref: ${{ inputs.base_branch }}
          path: target-branch

      - name: Set up Helm
        if: steps.changed-files.outputs.chart_values_any_changed == 'true' || steps.changed-files.outputs.env_values_any_changed == 'true'
        run: |
          helm repo add ${{ inputs.helm_repo_name }} ${{ inputs.helm_repo_url }}
          helm dependency build ${{ env.HELM_CHART_PATH}}
          helm dependency build target-branch/${{ env.HELM_CHART_PATH}}

      - name: Process environments
        if: steps.changed-files.outputs.chart_values_any_changed == 'true' || steps.changed-files.outputs.env_values_any_changed == 'true'
        id: process-envs
        run: |
          mkdir -p ${{ env.OUTPUT_PATH }}
          SECTION_FILE=${{ env.OUTPUT_PATH }}/chart_section.md

          # Build this chart's section for the single aggregated PR comment. The
          # section is wrapped in markers keyed by COMMENT_HEADER so the post step
          # can splice it into the shared comment without touching other charts.
          echo "<!-- gitops-helm-diff:chart=${COMMENT_HEADER}:start -->" > "$SECTION_FILE"
          echo "### Chart: \`${COMMENT_HEADER}\`" >> "$SECTION_FILE"
          echo "" >> "$SECTION_FILE"

          HAS_CHANGES=false

          for ENV in ${{ steps.filter-envs.outputs.env_list }}; do
            echo "Processing environment: $ENV"

            # Check if environment directory exists in both branches
            if [ ! -d "${{ env.ENVIRONMENTS_PATH }}/$ENV" ] || [ ! -d "target-branch/${{ env.ENVIRONMENTS_PATH }}/$ENV" ]; then
              echo "Warning: Environment directory $ENV does not exist in one or both branches, skipping"
              continue
            fi

            # Generate rendered output for PR branch with environment values

            helm template ${{ env.HELM_RELEASE_NAME}} ${{ env.HELM_CHART_PATH}} \
              -f ${{ env.ENVIRONMENTS_PATH }}/$ENV/values.yaml \
              > rendered-$ENV.yaml

            # Generate rendered output for target branch with environment values
            helm template ${{ env.HELM_RELEASE_NAME}} target-branch/${{ env.HELM_CHART_PATH}} \
              -f target-branch/${{ env.ENVIRONMENTS_PATH }}/$ENV/values.yaml \
              > target-branch/rendered-$ENV.yaml

            # Generate diff for this environment
            diff -u target-branch/rendered-$ENV.yaml rendered-$ENV.yaml > ${{ env.OUTPUT_PATH }}/diff-$ENV.txt || true

            # Check if diff exists and add to summary
            if [ -s ${{ env.OUTPUT_PATH }}/diff-$ENV.txt ]; then
              HAS_CHANGES=true
              echo "#### Environment: $ENV" >> "$SECTION_FILE"
              echo "" >> "$SECTION_FILE"

              echo "<details><summary>Changes detected for $ENV environment:</summary>" >> "$SECTION_FILE"
              echo "" >> "$SECTION_FILE"
              echo '```diff' >> "$SECTION_FILE"
              cat ${{ env.OUTPUT_PATH }}/diff-$ENV.txt >> "$SECTION_FILE"
              echo '```' >> "$SECTION_FILE"
              echo "</details>" >> "$SECTION_FILE"
              echo "" >> "$SECTION_FILE"
            fi
          done

          echo "<!-- gitops-helm-diff:chart=${COMMENT_HEADER}:end -->" >> "$SECTION_FILE"
          echo "" >> "$SECTION_FILE"

          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT

      - name: Post diff as comment on PR
        if: steps.process-envs.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # All chart invocations on a PR share ONE comment identified by this marker.
          # Each chart owns a section between its own start/end markers; this step
          # splices our section into the shared comment, leaving other charts intact.
          MARKER="<!-- gitops-helm-diff -->"
          TITLE="## Helm Deployment Changes"
          START="<!-- gitops-helm-diff:chart=${COMMENT_HEADER}:start -->"
          END="<!-- gitops-helm-diff:chart=${COMMENT_HEADER}:end -->"
          SECTION_FILE=${{ env.OUTPUT_PATH }}/chart_section.md

          # Print $1 with OUR chart section (start..end inclusive) removed.
          strip_our_section() {
            awk -v s="$START" -v e="$END" '
              index($0, s) { skip = 1 }
              !skip        { print }
              index($0, e) { skip = 0 }
            ' "$1"
          }

          # Print only chart-section blocks from $1 (used to salvage sections from
          # duplicate comments created by a first-post race before deleting them).
          extract_sections() {
            awk '
              /<!-- gitops-helm-diff:chart=.*:start -->/ { insec = 1 }
              insec                                      { print }
              /<!-- gitops-helm-diff:chart=.*:end -->/   { insec = 0 }
            ' "$1"
          }

          list_marker_comment_ids() {
            # Oldest-first (API returns ascending id); --jq runs per page under --paginate.
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
              --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id"
          }

          attempt=0
          max_attempts=5
          while :; do
            attempt=$((attempt + 1))
            mapfile -t IDS < <(list_marker_comment_ids)

            if [ "${#IDS[@]}" -eq 0 ]; then
              # No shared comment yet: create one with the title and our section.
              { printf '%s\n%s\n\n' "$MARKER" "$TITLE"; cat "$SECTION_FILE"; } > body.md
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file body.md
            else
              CANON="${IDS[0]}"
              gh api "repos/${REPO}/issues/comments/${CANON}" --jq .body > base.md
              # Fold any duplicate comments' sections into the canonical one, then remove them.
              for dup in "${IDS[@]:1}"; do
                gh api "repos/${REPO}/issues/comments/${dup}" --jq .body > dup.md
                extract_sections dup.md >> base.md
                gh api --method DELETE "repos/${REPO}/issues/comments/${dup}" || true
              done
              # Replace our section: drop the old one (if any), append the fresh one.
              strip_our_section base.md > body.md
              cat "$SECTION_FILE" >> body.md
              gh api --method PATCH "repos/${REPO}/issues/comments/${CANON}" -F body=@body.md
            fi

            # Verify our section survived a possible concurrent writer; retry if not.
            sleep "$attempt"
            if list_marker_comment_ids | head -n1 | grep -q . \
               && gh api "repos/${REPO}/issues/comments/$(list_marker_comment_ids | head -n1)" \
                    --jq .body | grep -qF "$START"; then
              echo "Chart section for '${COMMENT_HEADER}' is present in the shared comment."
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::warning::Could not confirm helm-diff section for '${COMMENT_HEADER}' after ${max_attempts} attempts (likely a concurrent update race)."
              break
            fi
            echo "Section missing after write (concurrent update); retrying (${attempt}/${max_attempts})..."
          done
