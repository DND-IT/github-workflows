name: Test Datadog CR Validate Workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/_test-datadog-cr-validate.yaml"
      - ".github/workflows/datadog-cr-validate.yaml"
      - "actions/datadog-cr-validate/**"
      - "tests/datadog/**"

permissions:
  contents: read
  id-token: write

jobs:
  test_validate:
    name: Test validate
    uses: ./.github/workflows/datadog-cr-validate.yaml
    with:
      charts: |
        tests/datadog/chart --set team=validate
      check_tag_values: true

  test_python:
    name: Test validate.py
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install dependencies
        run: python -m pip install -r tests/datadog/requirements.txt

      - name: Run tests
        run: python -m pytest tests/datadog
