name: Datadog CR Validate
description: Render Helm charts with Datadog Operator resources and validate them against the CRD schemas and the Datadog API

inputs:
  charts:
    description: |
      Helm charts to render and validate, one per line: a chart path, optionally followed by extra `helm template` arguments.
      Example: |
        deploy/datadog-monitoring
        deploy/datadog-agent --set clusterName=validate
    required: true
  check_tag_values:
    description: Fail when a metric query uses a metric that has not been reported in the last 7 days, and warn when it filters on a tag value not indexed in that window
    default: "false"
  dd_site:
    description: Datadog site to validate against
    default: datadoghq.eu
  aws_oidc_role_arn:
    description: IAM role assumed through GitHub OIDC to read the Datadog keys
    required: true
  aws_region:
    description: AWS region of the Datadog keys secret
    default: eu-central-1
  dd_keys_secret_name:
    description: Secrets Manager secret holding the Datadog keys as JSON with `DD_API_KEY` and `DD_APP_KEY`
    default: dai/datadog/crValidateKeys

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x

    - name: Install dependencies
      shell: bash
      env:
        KUBECONFORM_VERSION: v0.8.0
        KUBECONFORM_SHA256_AMD64: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        KUBECONFORM_SHA256_ARM64: 1f53fc8e81258197a35e8603054162a5af1de8c5af13746c71ab680d9534ed87
      run: |
        python -m pip install -r "$GITHUB_ACTION_PATH/requirements.txt"
        case "$(uname -m)" in
          x86_64) arch=amd64 sha256=$KUBECONFORM_SHA256_AMD64 ;;
          aarch64 | arm64) arch=arm64 sha256=$KUBECONFORM_SHA256_ARM64 ;;
          *) echo "::error title=Unsupported runner::kubeconform has no build for $(uname -m)"; exit 1 ;;
        esac
        tarball="$RUNNER_TEMP/kubeconform.tar.gz"
        curl -fsSL -o "$tarball" "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-$arch.tar.gz"
        echo "$sha256  $tarball" | sha256sum -c -
        sudo tar -xzf "$tarball" -C /usr/local/bin kubeconform

    - name: Render charts
      id: render
      shell: bash
      env:
        CHARTS: ${{ inputs.charts }}
      run: python "$GITHUB_ACTION_PATH/validate.py" render "$CHARTS" "$RUNNER_TEMP/datadog-cr-validate"

    - name: Validate CRD schemas
      shell: bash
      run: python "$GITHUB_ACTION_PATH/validate.py" schemas "$RUNNER_TEMP/datadog-cr-validate"

    - name: Lint dashboards
      if: ${{ !cancelled() && steps.render.outcome == 'success' }}
      shell: bash
      run: python "$GITHUB_ACTION_PATH/validate.py" dashboards "$RUNNER_TEMP/datadog-cr-validate"

    - name: Check the AWS role
      id: role
      if: ${{ !cancelled() }}
      shell: bash
      env:
        AWS_OIDC_ROLE_ARN: ${{ inputs.aws_oidc_role_arn }}
      run: |
        if [ -z "$AWS_OIDC_ROLE_ARN" ]; then
          echo "::error title=No AWS role::Set aws_oidc_role_arn, or the DD_CR_VALIDATE_ROLE_ARN organization variable for the reusable workflow, to run the Datadog API checks"
          exit 1
        fi

    - name: Configure AWS credentials
      id: aws
      if: ${{ !cancelled() && steps.role.outcome == 'success' }}
      uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6
      with:
        role-to-assume: ${{ inputs.aws_oidc_role_arn }}
        aws-region: ${{ inputs.aws_region }}

    - name: Read Datadog keys
      id: dd_keys
      if: ${{ !cancelled() && steps.aws.outcome == 'success' }}
      uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3
      with:
        secret-ids: ",${{ inputs.dd_keys_secret_name }}"
        parse-json-secrets: true

    - name: Validate monitors with the Datadog API
      if: ${{ !cancelled() && steps.render.outcome == 'success' && steps.dd_keys.outcome == 'success' }}
      shell: bash
      env:
        DD_SITE: ${{ inputs.dd_site }}
      run: python "$GITHUB_ACTION_PATH/validate.py" monitors "$RUNNER_TEMP/datadog-cr-validate"

    - name: Check metric tag values
      if: ${{ !cancelled() && steps.render.outcome == 'success' && steps.dd_keys.outcome == 'success' && inputs.check_tag_values == 'true' }}
      shell: bash
      env:
        DD_SITE: ${{ inputs.dd_site }}
      run: python "$GITHUB_ACTION_PATH/validate.py" tags "$RUNNER_TEMP/datadog-cr-validate"
